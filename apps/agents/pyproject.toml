[project]
name = "smart-rag-agents"
version = "0.1.0"
description = "LangGraph query and ingestion graph definitions for Smart RAG."
requires-python = ">=3.11,<3.13"
dependencies = [
    "smart-rag-core",
    "langgraph==1.2.11",
    "psycopg[binary]==3.3.3",
    "langgraph-checkpoint-postgres==3.1.3",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_rag_agents"]
