[project]
name = "smart-rag-backend"
version = "0.1.0"
description = "FastAPI HTTP/SSE transport boundary for Smart RAG."
requires-python = ">=3.11,<3.13"
dependencies = [
    "smart-rag-agents",
    "smart-rag-core",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "psycopg[binary]==3.3.3",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_rag_api"]

[project.scripts]
smart-rag-api = "smart_rag_api.main:run"
