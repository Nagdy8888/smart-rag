---
schemaVersion: "2.2"
description: >-
  One-shot production expand migration. The instance role fetches
  smart-rag/production/db. Output is redacted. Process environment is unset
  on EXIT. Live production migrate remains Blocked in this packet.
parameters:
  MigrationHash:
    type: String
    description: Immutable SHA-256 of reviewed supabase/migrations files.
  Operator:
    type: String
    description: GitHub actor. Not a credential.
mainSteps:
  - action: aws:runShellScript
    name: ProductionExpandMigrate
    inputs:
      timeoutSeconds: 900
      runCommand:
        - |
          set -eu
          RESULT="failed"
          DSN_FILE="/tmp/smart-rag-migrate-dsn"
          unset_secrets() {
            unset SECRET_JSON DATABASE_URL PGPASSWORD SUPABASE_DB_URL MIGRATION_DSN
            rm -f "${DSN_FILE}"
            echo "migration_hash={{MigrationHash}} operator={{Operator}} result=${RESULT}"
          }
          trap unset_secrets EXIT
          set +x
          export AWS_PAGER=""
          if grep -R -E -i --include='*.sql' 'CREATE[[:space:]]+EXTENSION' /opt/smart-rag/supabase/migrations >/dev/null 2>&1; then
            echo "blocked: CREATE EXTENSION is forbidden"
            RESULT="blocked_extension"
            exit 1
          fi
          if grep -R -E -i --include='*.sql' 'DROP[[:space:]]+TABLE|DROP[[:space:]]+COLUMN' /opt/smart-rag/supabase/migrations >/dev/null 2>&1; then
            echo "blocked: contraction DDL is forbidden in this release"
            RESULT="blocked_contraction"
            exit 1
          fi
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id 'smart-rag/production/db' --query SecretString --output text 2>/dev/null || true)"
          if [ -z "${SECRET_JSON}" ] || [ "${SECRET_JSON}" = "None" ]; then
            echo "blocked: production db secret value is absent"
            RESULT="blocked_secret"
            exit 1
          fi
          echo "secret fetched; values redacted; live production migrate stays operator-gated"
          RESULT="blocked_live"
          exit 1
