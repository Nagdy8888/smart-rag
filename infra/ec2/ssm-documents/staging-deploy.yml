---
schemaVersion: "2.2"
description: >-
  One-shot staging deploy of digest-pinned Compose services with the t3.micro
  overlay and t3micro-edge profile. Does not fetch database secrets. Does not
  start worker, ClamAV, parser, or api-green. Unsets process environment on
  EXIT. Records operator and result. Do not send this document until the
  operator says the instance is ready.
parameters:
  Operator:
    type: String
    interpolationType: ENV_VAR
    allowedPattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}(\[bot\])?$'
    description: GitHub actor. Not a credential.
  ImageApi:
    type: String
    interpolationType: ENV_VAR
    allowedPattern: '^(sha256:[a-f0-9]{64}|[A-Za-z0-9][A-Za-z0-9._/-]{0,255}@sha256:[a-f0-9]{64})$'
    description: Immutable API image id. Not a secret.
mainSteps:
  - action: aws:runShellScript
    name: StagingDeploy
    inputs:
      timeoutSeconds: 1200
      runCommand:
        - |
          set -eu
          : "${SSM_Operator:?SSM Agent ENV_VAR interpolation is required}"
          : "${SSM_ImageApi:?Missing immutable image id}"
          RESULT="failed"
          unset_env() {
            unset DATABASE_URL PGPASSWORD SUPABASE_SERVICE_ROLE_KEY
            echo "operator=${SSM_Operator} image_api=${SSM_ImageApi} result=${RESULT}"
          }
          trap unset_env EXIT
          set +x
          if [ ! -f /opt/smart-rag/docker-compose.staging.yml ]; then
            echo "blocked: staging compose is missing on the instance"
            RESULT="blocked_compose"
            exit 1
          fi
          if [ ! -f /opt/smart-rag/docker-compose.t3micro.yml ]; then
            echo "blocked: t3micro overlay is missing on the instance"
            RESULT="blocked_overlay"
            exit 1
          fi
          if [ ! -f /opt/smart-rag/.env ]; then
            echo "blocked: staging env file is missing on the instance"
            RESULT="blocked_env"
            exit 1
          fi
          cd /opt/smart-rag
          docker compose -f docker-compose.staging.yml -f docker-compose.t3micro.yml --env-file /opt/smart-rag/.env pull
          docker compose -f docker-compose.staging.yml -f docker-compose.t3micro.yml --env-file /opt/smart-rag/.env --profile t3micro-edge up -d
          RESULT="ok"
          echo "deploy completed without database secrets in the GitHub role"
