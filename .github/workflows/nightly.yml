name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.23"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: pnpm
      - run: uv sync --all-packages --group dev --python 3.11 --frozen
      - run: pnpm install --frozen-lockfile
      - name: Fast tier
        run: uv run python scripts/check.py --tier fast
      - name: OpenAPI and migration static checks
        run: |
          uv run python scripts/ci/check_openapi.py
          uv run python scripts/ci/check_migrations.py
      # Future nightly: Playwright full, retrieval evals, Trivy, backup/restart, live-model opt-in.
