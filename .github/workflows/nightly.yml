name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    uses: ./.github/workflows/job-preflight.yml
  format-lint:
    uses: ./.github/workflows/job-format-lint.yml
  types:
    uses: ./.github/workflows/job-types.yml
  unit:
    uses: ./.github/workflows/job-unit.yml
  contract:
    uses: ./.github/workflows/job-contract.yml
  docs-frontend:
    uses: ./.github/workflows/job-docs-frontend.yml
  openapi-migrations:
    uses: ./.github/workflows/job-openapi-migrations.yml
  # Unit job includes scripts/ci/check_phase6_eval_registry.py (holdout sealed).
  # Future nightly: Playwright full, live retrieval evals, Trivy, backup/restart, live-model opt-in.
