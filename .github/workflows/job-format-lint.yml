name: Format and lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python-uv

      - name: Format
        run: uv run python scripts/check.py --tier format

      - name: Lint
        run: uv run python scripts/check.py --tier lint
