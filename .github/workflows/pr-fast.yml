name: PR fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.11.23"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: pnpm

      - name: Plan integrity
        run: python .cursor/plans/hybrid-graph-rag/scripts/verify_plan_integrity.py

      - name: uv sync locked
        run: uv sync --all-packages --group dev --python 3.11 --frozen

      - name: pnpm install frozen
        run: pnpm install --frozen-lockfile

      - name: Install Mermaid browser
        run: pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Python dependency audit
        run: |
          uv export --frozen --all-packages --group dev --no-emit-workspace --format requirements.txt --output-file "${RUNNER_TEMP}/requirements.txt"
          uv run pip-audit --strict --requirement "${RUNNER_TEMP}/requirements.txt"

      - name: Node dependency audit
        run: pnpm audit --audit-level high

      - name: Fast quality tier
        run: uv run python scripts/check.py --tier fast --mermaid-puppeteer-config scripts/ci/puppeteer-no-sandbox.json

      - name: OpenAPI foundation snapshot
        run: uv run python scripts/ci/check_openapi.py

      - name: Migration policy
        run: uv run python scripts/ci/check_migrations.py
