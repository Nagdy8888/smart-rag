name: PR fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ./.github/workflows/job-preflight.yml
  format-lint:
    uses: ./.github/workflows/job-format-lint.yml
  types:
    uses: ./.github/workflows/job-types.yml
  unit:
    uses: ./.github/workflows/job-unit.yml
  contract:
    uses: ./.github/workflows/job-contract.yml
  docs-frontend:
    uses: ./.github/workflows/job-docs-frontend.yml
  openapi-migrations:
    uses: ./.github/workflows/job-openapi-migrations.yml
