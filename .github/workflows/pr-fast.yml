name: PR fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.23"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: pnpm

      - name: Plan integrity
        run: python .cursor/plans/hybrid-graph-rag/scripts/verify_plan_integrity.py

      - name: uv sync locked
        run: uv sync --all-packages --group dev --python 3.11 --frozen

      - name: pnpm install frozen
        run: pnpm install --frozen-lockfile

      - name: Python dependency audit
        run: |
          uv export --frozen --all-packages --group dev --no-emit-workspace --format requirements.txt --output-file "${RUNNER_TEMP}/requirements.txt"
          uv run pip-audit --strict --requirement "${RUNNER_TEMP}/requirements.txt"

      - name: Node dependency audit
        run: pnpm audit --audit-level high

      - name: Fast quality tier
        run: uv run python scripts/check.py --tier fast

      - name: OpenAPI foundation snapshot
        run: uv run python scripts/ci/check_openapi.py

      - name: Migration policy
        run: uv run python scripts/ci/check_migrations.py
