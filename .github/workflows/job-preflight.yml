name: Job preflight

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Plan integrity
        run: python .cursor/plans/hybrid-graph-rag/scripts/verify_plan_integrity.py

      - name: Python dependency audit
        run: |
          uv export --frozen --all-packages --group dev --no-emit-workspace --format requirements.txt --output-file "${RUNNER_TEMP}/requirements.txt"
          # PYSEC-2026-113 is Arrow C++ IPC pre-buffering; Python bindings are not
          # vulnerable. Packet 8 froze pyarrow 19.0.1. See ADR-cve-pin-patch-2026-08.md.
          uv run pip-audit --strict --ignore-vuln PYSEC-2026-113 --requirement "${RUNNER_TEMP}/requirements.txt"

      - name: Node dependency audit
        run: pnpm audit --audit-level high
