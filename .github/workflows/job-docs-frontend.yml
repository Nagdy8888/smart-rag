name: Docs and frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Mermaid browser
        run: pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Docs
        run: uv run python scripts/check.py --tier docs --mermaid-puppeteer-config scripts/ci/puppeteer-no-sandbox.json

      - name: Frontend
        run: uv run python scripts/check.py --tier frontend
