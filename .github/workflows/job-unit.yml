name: Unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python-uv

      - name: Unit tests
        run: uv run python scripts/check.py --tier unit
