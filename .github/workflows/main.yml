name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.23"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: uv sync
        run: uv sync --all-packages --group dev --python 3.11 --frozen
      - name: Unit and contract
        run: |
          uv run python scripts/check.py --tier unit
          uv run python scripts/check.py --tier contract
      - name: Compose config
        run: docker compose --env-file .env.example config --quiet
      # Future (not enabled): Supabase reset/RLS, LightRAG, retrieval evals, restore.
