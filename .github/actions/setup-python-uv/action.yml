name: Setup Python with uv
description: Install Python 3.11 and uv 0.11.23, then sync all workspace packages from the frozen lockfile with the dev dependency group.
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
      with:
        version: "0.11.23"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.11"
    - name: Sync Python dependencies
      run: uv sync --all-packages --group dev --python 3.11 --frozen
      shell: bash
