[project]
name = "smart-rag-core"
version = "0.1.0"
description = "Shared domain, gateways, retrieval interfaces, and settings for Smart RAG."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic==2.13.4",
    "typing-extensions==4.16.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_rag_core"]
