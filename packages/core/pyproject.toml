[project]
name = "smart-rag-core"
version = "0.1.0"
description = "Shared domain, gateways, retrieval interfaces, and settings for Smart RAG."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.0",
    "typing-extensions==4.16.0",
    "pymupdf==1.25.5",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.13.3",
    "lxml==6.1.0",
    "markdown-it-py==3.0.0",
    "pytesseract==0.3.13",
    "Pillow==12.3.0",
    "tiktoken==0.9.0",
    "pyarrow==19.0.1",
    "duckdb==1.2.1",
    "langsmith==0.10.18",
    "opentelemetry-api==1.37.0",
    "opentelemetry-sdk==1.37.0",
    "opentelemetry-exporter-otlp-proto-http==1.37.0",
    "sentry-sdk==2.72.0",
    "openai==2.26.0",
    "lightrag-hku==1.5.6",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_rag_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/smart_rag_core/retrieval/frozen/hybrid_default_v1.json" = "smart_rag_core/retrieval/frozen/hybrid_default_v1.json"
