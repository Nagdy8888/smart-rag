title = "Smart RAG secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Verified imported skill file SHA-256 values; contract tests bind these to file bytes"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)\.agents/skills/upstream-manifest\.json$''',
]
regexes = [
  '''^\s*"[^"\r\n]+\.(?:md|json)": "[0-9a-f]{64}",?\s*$''',
]

[[allowlists]]
description = "Canonical plan prose that names token and API concepts without values"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)\.cursor/plans/hybrid-graph-rag/02-phase-identity-data\.md$''',
  '''(?:^|/)\.cursor/plans/hybrid-graph-rag/07-phase-stitch-specification/00-shared-contracts\.md$''',
]
regexes = [
  '''invented narrow service tokens, ClamAV/freshclam execution''',
  '''visible diagnostic, state family, API mapping, Arabic/bidirectional fixture''',
]

[[allowlists]]
description = "SHA-256 values in generated plan-integrity manifests"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)(?:\.cursor/plans/hybrid-graph-rag|scripts/plan_integrity)/plan-integrity-lock\.json$''',
]
regexes = [
  '''^\s*".+\.md": "[0-9a-f]{64}",?\s*$''',
]

[[allowlists]]
description = "Published local Supabase demo anon JWT for Playwright and CI frontend build"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)apps/frontend/playwright\.config\.ts$''',
  '''(?:^|/)scripts/check\.py$''',
]
regexes = [
  '''eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24i''',
]

[[allowlists]]
description = "Inert LangSmith leak canary, not a live provider key"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)tests/.+$''',
]
regexes = [
  '''sk-canarysecretFORBID''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.canarypayload\.signature''',
]

[[allowlists]]
description = "Empty hosted-ingest example key names with no values"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)\.env\.hosted-ingest\.example$''',
]
regexes = [
  '''OPENAI_API_KEY=''',
  '''LANGSMITH_API_KEY=''',
]

[[allowlists]]
description = "Pinned GitHub Action commit SHA, not a credential"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)packages/core/src/smart_rag_core/release/phase10_constants\.py$''',
]
regexes = [
  '''CONFIGURE_AWS_CREDENTIALS_SHA = "[0-9a-f]{40}"''',
]

[[allowlists]]
description = "Phase 9 evidence image digests and rebuild SHA-256 values"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)docs/deployment/phase-09/.+\.json$''',
]
regexes = [
  '''sha256:[0-9a-f]{64}''',
]

[[allowlists]]
description = "Synthetic glossary inventory codes that trip generic-api-key"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)tests/unit/test_glossary_validation\.py$''',
]
regexes = [
  '''idempotency_key="glossary-''',
]
