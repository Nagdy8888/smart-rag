[project]
name = "smart-rag-workspace"
version = "0.1.0"
description = "Non-distributable uv workspace root for Smart RAG deployables."
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "langgraph-cli==0.4.31",
    "ruff==0.16.2",
    "pyright==1.1.411",
    "pre-commit==4.6.2",
    "pyyaml==6.0.3",
    "openai==2.26.0",
    "psycopg[binary]==3.3.3",
    "pip-audit>=2.10.1",
    "duckdb==1.2.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/agents",
    "apps/backend",
    "apps/worker",
    "packages/core",
]

[tool.uv.sources]
smart-rag-agents = { workspace = true }
smart-rag-backend = { workspace = true }
smart-rag-worker = { workspace = true }
smart-rag-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-config --strict-markers"
xfail_strict = true

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    ".venv",
    "node_modules",
    "prev_review",
    ".cursor",
    "docs",
    "stitch_smart_rag_enterprise_console",
]

[tool.ruff.lint]
ignore = ["D202"]
select = [
    "B",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "S",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/contract/integration_support.py" = ["S603", "S607"]
"tests/contract/test_parser_sandbox.py" = ["S607"]
"packages/core/src/smart_rag_core/ingestion/parser/sandbox/launcher.py" = ["S108", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = [
    "apps/agents/src",
    "apps/backend/src",
    "apps/worker/src",
    "infra/crawl-proxy",
    "packages/core/src",
    "scripts",
    "tests",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "node_modules",
    "prev_review",
]
reportMissingTypeStubs = false
executionEnvironments = [
    { root = ".", extraPaths = [
        "apps/agents/src",
        "apps/backend/src",
        "apps/worker/src",
        "packages/core/src",
    ] },
]
